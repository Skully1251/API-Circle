services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        limit_req_zone $$binary_remote_addr zone=api_rate_limit:10m rate=20r/s;

        server {
          listen 80;
          server_name _;
          client_max_body_size 10m;
 
          location / {
            limit_req zone=api_rate_limit burst=40 nodelay;
            proxy_pass http://api-gateway:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        NGINX
        nginx -g 'daemon off;'
    networks:
      - api-network

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      ADMIN_SERVICE_URL: http://admin-service:3003
      API_CATALOG_SERVICE_URL: http://api-catalog-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - api-network

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment: &service-environment
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://api_circle:api_circle_dev@postgres:5432/api_circle
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on: &service-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks: &service-networks
      - api-network

  user-service:
    build: ./services/user-service
    ports:
      - "3002:3002"
    expose:
      - "3002"
    environment:
      <<: *service-environment
      PORT: 3002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: *service-networks

  api-key-service:
    build: ./services/api-key-service
    ports:
      - "3008:3008"
    expose:
      - "3008"
    environment:
      <<: *service-environment
      PORT: 3008
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: *service-networks

  admin-service:
    build: ./services/admin-service
    ports:
      - "3003:3003"
    expose:
      - "3003"
    environment:
      <<: *service-environment
      PORT: 3003
    depends_on: *service-dependencies
    networks: *service-networks

  api-catalog-service:
    build: ./services/api-catalog-service
    ports:
      - "3004:3004"
    expose:
      - "3004"
    environment:
      <<: *service-environment
      PORT: 3004
    depends_on: *service-dependencies
    networks: *service-networks

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "3005:3005"
    expose:
      - "3005"
    environment:
      <<: *service-environment
      PORT: 3005
    depends_on: *service-dependencies
    networks: *service-networks

  notification-service:
    build: ./services/notification-service
    ports:
      - "3006:3006"
    expose:
      - "3006"
    environment:
      <<: *service-environment
      PORT: 3006
    depends_on: *service-dependencies
    networks: *service-networks

  subscription-service:
    build: ./services/subscription-service
    ports:
      - "3007:3007"
    expose:
      - "3007"
    environment:
      <<: *service-environment
      PORT: 3007
    depends_on: *service-dependencies
    networks: *service-networks

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_circle
      POSTGRES_USER: api_circle
      POSTGRES_PASSWORD: api_circle_dev
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_circle -d api_circle"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - api-network

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    expose:
      - "9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - api-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  api-network:
    driver: bridge
